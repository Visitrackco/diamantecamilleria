<mat-form-field class="multi-field">
  <mat-select [ngModel]="seleccion" (selectionChange)="cambio($event.value)" (closed)="search = ''"
    panelClass="perfil-select-panel ubic-panel" multiple placeholder="Todas">
    <div class="select-search">
      <input type="text" [placeholder]="buscar" [(ngModel)]="search"
        [ngModelOptions]="{ standalone: true }" (keydown)="$event.stopPropagation()"
        (click)="$event.stopPropagation()" />
    </div>
    <mat-option *ngFor="let u of filtradas()" [value]="u._id">{{ u.Name }}</mat-option>
    <div class="select-empty" *ngIf="!filtradas().length">Sin resultados</div>
  </mat-select>
</mat-form-field>
